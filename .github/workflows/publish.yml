name: Publish Package to npmjs
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"
          # OIDCを使用する場合、always-authをtrueに設定
          always-auth: true

      - run: npm ci

      # 追加: ビルド実行
      - run: npm run build

      # ビルドが成功したら公開
      # OIDCを使用する場合、setup-nodeが自動的にOIDCトークンを使用
      # npm側でOIDCプロバイダーを設定する必要があります
      - run: npm publish --provenance --access public
